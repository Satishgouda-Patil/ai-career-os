  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971
    expiration-ms: 86400000
  ollama:
    base-url: http://localhost:11434
    model: llama3
  minio:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket-name: resumes
  telegram:
