<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Required Fields Test</title>
</head>
<body>
    <form id="req-form">
        <label for="reqAttr">Req Attr</label>
        <input type="text" id="reqAttr" required>

        <label for="ariaReq">Aria Req</label>
        <input type="text" id="ariaReq" aria-required="true">

        <label for="optionalField">Optional</label>
        <input type="text" id="optionalField">
    </form>
</body>
</html>
